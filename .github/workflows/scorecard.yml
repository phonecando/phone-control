name: Scorecard

# OpenSSF Scorecard supply-chain analysis, published to api.scorecard.dev
# (for a badge) and uploaded to code scanning. Runs on pushes to main, branch
# protection changes, weekly and on demand. Shaped by the scorecard-action
# "Workflow Restrictions": no top-level env/defaults, no workflow-level write
# permissions, id-token only on the analysis job, whose steps may only use
# checkout, upload-artifact, codeql upload-sarif and scorecard-action.

on:
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: '57 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard only accepts the default branch outside pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # CI-Tests / SAST checks read workflow runs
      checks: read # CI-Tests check reads check runs
      issues: read # Maintained check reads issue activity
      pull-requests: read # Code-Review check reads merged PRs
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token proves the published result came from this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
