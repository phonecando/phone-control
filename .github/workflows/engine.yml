name: Engine

# The phone-control engine (engine/, its own Gradle build) and the phone_*
# tools (tools/): the full build, a pure-JVM OS x JDK matrix, every module
# built alone, the dependency law of AGENTS.md (static, Gradle-resolved and
# published POMs), the sample and consumer-sample against their documented
# output, the Android device harnesses on an emulator, and the tools' tests.
# Runs on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push runs to completion (one group per commit); a newer commit on the
# same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  modules:
    name: Module list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: engine/settings.gradle.kts
          sparse-checkout-cone-mode: false
      - name: Read include(...) from settings.gradle.kts
        id: list
        run: |
          set -euo pipefail
          list=$(grep -oE '"(:[A-Za-z0-9_-]+)"' engine/settings.gradle.kts | tr -d '":' | jq -Rnc '[inputs]')
          [[ "$list" != '[]' ]] || { echo "::error::no modules found in engine/settings.gradle.kts"; exit 1; }
          echo "modules: $list"
          echo "list=$list" >>"$GITHUB_OUTPUT"

  dependency-law:
    name: Dependency law
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Static law (build files and sources)
        run: |
          set -euo pipefail
          mkdir -p build/ci
          node ../.github/ci/engine/check-deps.mjs . | tee build/ci/law-static.txt
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      - name: Resolve every module's main and test classpaths
        run: bash ../.github/ci/engine/resolve-deps.sh build/ci/resolved
      - name: Resolved law (Gradle's own view)
        run: |
          set -euo pipefail
          node ../.github/ci/engine/check-deps.mjs --resolved build/ci/resolved . | tee build/ci/law-resolved.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-dependency-reports
          path: engine/build/ci/
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build (./gradlew build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      # Validates every gradle-wrapper.jar checksum, then caches Gradle state.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      # Everything: JVM tests, Android unit tests, lint, AARs, the sample app.
      - name: ./gradlew build
        run: |
          set -euo pipefail
          mkdir -p build/ci
          ./gradlew build --continue --warning-mode all 2>&1 | tee build/ci/build.log
      - name: Test summary
        if: always()
        run: node ../.github/ci/engine/junit-summary.mjs . --title 'Engine ./gradlew build' --require-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-build-reports
          path: |
            engine/**/build/reports/
            engine/**/build/test-results/**/*.xml
            engine/build/ci/build.log
          retention-days: 7
          if-no-files-found: warn

  jvm-matrix:
    # Compilation uses the build's jvmToolchain(17) on a JDK 21 Gradle
    # daemon; test-jdk.init.gradle runs the tests and the sample on the matrix
    # JDK, proving the target-17 bytecode on 17/21/25 on every hosted OS and
    # CPU. ANDROID_HOME is unset (the arm runner has no Android SDK at all):
    # the pure modules must not need one.
    name: JVM ${{ matrix.os }} / JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        jdk: [17, 21, 25]
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      TEST_JDK: ${{ matrix.jdk }}
    steps:
      # Without this, Windows checks gradlew out with CRLF and bash cannot run it.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The last one becomes JAVA_HOME (the Gradle daemon).
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      - name: Pure-JVM tests on JDK ${{ matrix.jdk }}
        run: |
          set -euo pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew --init-script ../.github/ci/engine/test-jdk.init.gradle -PpceTestJdk="$TEST_JDK" \
            :api:test :core:test :json:test :pack:test :testkit:test :gates:test :bridge:test
      - name: Sample on JDK ${{ matrix.jdk }} matches docs/guides/quickstart.md
        run: |
          set -euo pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT
          mkdir -p build/ci
          ./gradlew -q --init-script ../.github/ci/engine/test-jdk.init.gradle -PpceTestJdk="$TEST_JDK" \
            :sample:run >build/ci/sample.txt
          cat build/ci/sample.txt
          node ../.github/ci/engine/expect-output.mjs --doc docs/guides/quickstart.md \
            --after 'Expected sample output' build/ci/sample.txt
      - name: Test summary
        if: always()
        env:
          TITLE: JVM ${{ matrix.os }} / JDK ${{ matrix.jdk }}
        run: node ../.github/ci/engine/junit-summary.mjs . --title "$TITLE" --require-tests

  module-isolation:
    # Each module must build, test and publish alone: a fresh runner per
    # module catches one that only builds because a sibling's task ran first,
    # or that leans on an undeclared dependency.
    name: Alone :${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    defaults:
      run:
        working-directory: engine
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      - name: Build, test and publish :${{ matrix.module }} alone
        run: |
          set -euo pipefail
          tasks=(":$MODULE:build")
          if grep -q 'maven-publish' "$MODULE/build.gradle.kts"; then tasks+=(":$MODULE:publishToMavenLocal"); fi
          ./gradlew "${tasks[@]}" --no-build-cache
      - name: Published pce-${{ matrix.module }} without its siblings
        run: |
          set -euo pipefail
          grep -q 'maven-publish' "$MODULE/build.gradle.kts" || { echo "$MODULE does not publish"; exit 0; }
          repo="$HOME/.m2/repository/com/phonecando/pce"
          ls "$repo/pce-$MODULE"/*/pce-"$MODULE"-*.pom
          others=$(find "$repo" -mindepth 1 -maxdepth 1 ! -name "pce-$MODULE" -printf '%f ')
          [[ -z "$others" ]] || { echo "::error:::$MODULE:publishToMavenLocal also published: $others"; exit 1; }

  sample-run:
    name: Sample (:sample:run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      # Observe, resolve, AMBIGUOUS for duplicate text, tap, assert; the docs
      # promise this exact output, so a change to either fails here.
      - name: ./gradlew :sample:run matches docs/guides/quickstart.md
        run: |
          set -euo pipefail
          mkdir -p build/ci
          ./gradlew -q :sample:run >build/ci/sample.txt
          cat build/ci/sample.txt
          node ../.github/ci/engine/expect-output.mjs --doc docs/guides/quickstart.md \
            --after 'Expected sample output' build/ci/sample.txt

  publish-consumer:
    # The published-coordinate path: publishToMavenLocal, the law on the
    # published POMs, then consumer-sample as its own build that sees only
    # Maven coordinates.
    name: Publish + consumer-sample
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      - name: ./gradlew publishToMavenLocal
        run: ./gradlew publishToMavenLocal
      - name: Published POMs obey the dependency law
        run: |
          set -euo pipefail
          mkdir -p build/ci
          node ../.github/ci/engine/check-deps.mjs --published "$HOME/.m2/repository/com/phonecando/pce" .
      - name: consumer-sample (Maven coordinates only) matches docs/modules/consumer-sample.md
        run: |
          set -euo pipefail
          ./gradlew -q -p consumer-sample :api-consumer:run >build/ci/api-consumer.txt
          ./gradlew -q -p consumer-sample :core-consumer:run >build/ci/core-consumer.txt
          cat build/ci/api-consumer.txt build/ci/core-consumer.txt
          node ../.github/ci/engine/expect-output.mjs --doc docs/modules/consumer-sample.md \
            --after 'Expected output' build/ci/api-consumer.txt build/ci/core-consumer.txt

  device-harness:
    # The android/ime/shizuku androidTest sources are activity-driven device
    # harnesses, not instrumentation (am instrument force-stops the package
    # and kills the service under test), so this runs them the way their
    # module docs do and reads the PASS/FAIL line from logcat.
    name: Device harness API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 30 is the floor (the a11y harness takes screenshots, API 30+); 36
        # matches our test phone.
        api: [30, 36]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Point Gradle toolchains at the installed JDKs
        run: bash ../.github/ci/engine/gradle-jdks.sh
      - name: Build the harness APKs
        run: ./gradlew :android:assembleDebugAndroidTest :ime:assembleDebugAndroidTest :shizuku:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the harnesses on an API ${{ matrix.api }} emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: bash .github/ci/engine/device-harness.sh engine/build/device-harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-device-harness-api${{ matrix.api }}
          path: engine/build/device-harness/
          retention-days: 7
          if-no-files-found: warn

  tools:
    name: Tools (node --test, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor (tools/package.json engines); 24 the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: The tools' tests (zero dependencies)
        run: bash .github/ci/tools/check.sh

  dependency-graph:
    # Submits the engine's resolved Gradle runtime dependencies to GitHub's
    # dependency graph, for Dependabot alerts and dependency review. Not
    # part of engine-ok.
    name: Dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: engine
          dependency-graph-include-configurations: '^(runtimeClasspath|releaseRuntimeClasspath)$'

  engine-ok:
    # The one check to require in branch protection: green only when every
    # job above succeeded (a skipped or cancelled job counts as a failure).
    name: engine-ok
    if: always()
    needs: [modules, dependency-law, build, jvm-matrix, module-isolation, sample-run, publish-consumer, device-harness, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every blocking job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [[ -n "$failed" ]]; then
            echo "::error title=engine-ok::not green: $failed"
            exit 1
          fi
