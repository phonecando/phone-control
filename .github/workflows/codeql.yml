name: CodeQL

# CodeQL code scanning (advanced setup) of this repository's code: the
# workflows themselves, the phone_* tools' TypeScript and the engine's
# Kotlin, really compiled under CodeQL's tracer (Kotlin has no build-mode
# none). Runs on pushes to main, every pull request and weekly for new
# queries. Repo setting: code scanning "default setup" must be off.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # lets the CodeQL action read workflow run metadata
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 17 is the engine's toolchain (jvmToolchain(17)); 21 runs Gradle.
      - name: Set up JDK 17 + 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-strict-match: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/build'

      # --no-daemon/--no-build-cache: CodeQL only sees compilations in this
      # traced process tree. The Kotlin compiler runs in-process for the same
      # reason.
      - name: Build the engine (traced)
        if: matrix.language == 'java-kotlin'
        working-directory: engine
        run: >-
          ./gradlew --no-daemon --no-build-cache --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          assemble

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
